name: Praktijkpakket
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exacte ontwikkelcommit (40 tekens)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  pakket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Commit controleren
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Windows-testpakket bouwen (geen release)
        run: |
          for m in api invoer portaal; do (cd "$m" && npm ci --no-audit --no-fund); done
          tools/maak_laptoppakket.sh "$RUNNER_TEMP/batch-gui-laptop" windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch-gui-praktijkpakket-${{ inputs.commit }}
          path: ${{ runner.temp }}/batch-gui-laptop-*-windows.zip
          if-no-files-found: error
          retention-days: 14
