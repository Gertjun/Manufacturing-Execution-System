name: Tijdelijke gerichte schermvalidatie
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/schermvalidatie-tijdelijk.yml'
permissions:
  contents: read
jobs:
  schermen:
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.ref == 'feature/mes-phase-1' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: batchgui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Exacte head en base
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$BASE" = "31c86973bf13848cba44fc38785084953fe65e39"
          git merge-base --is-ancestor "$BASE" HEAD
          echo "HEAD=$HEAD BASE=$BASE"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Syntaxis schermtests en runner
        run: |
          set -e
          for f in invoer/e2e/*.mjs portaal/e2e/*.mjs; do
            echo "$f"
            node --check "$f"
          done
          sh -n tests/test_schermen.sh
          python3 -m py_compile tools/genereer_testdata.py
      - name: API installeren en typecheck
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Invoerscherm bouwen en offline regressie
        working-directory: invoer
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node e2e/offline-rechten.mjs
      - name: Portaal bouwen
        working-directory: portaal
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Schermtestafhankelijkheden
        run: |
          google-chrome --version
          psql --version
          python3 -m pip install --quiet "psycopg[binary]" openpyxl pillow pyzbar
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libzbar0 >/dev/null
      - name: Alle verplichte schermtests op fictieve PostgreSQL-data
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: sh tests/test_schermen.sh
      - name: Schermtestlogs
        if: always()
        run: |
          for log in /tmp/schermtest-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
