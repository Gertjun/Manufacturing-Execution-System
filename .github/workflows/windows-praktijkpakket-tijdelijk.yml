name: Tijdelijk Windows-praktijkpakket fase 1
on:
  push:
    branches: [test/windows-phase-1]
    paths: ['.github/workflows/windows-praktijkpakket-tijdelijk.yml']
permissions:
  contents: read
jobs:
  pakket:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6885efec84ac3ffa5cca30669e512f02a8989ee3
          persist-credentials: false
      - name: Geaccepteerde bron vastleggen
        run: |
          test "$(git rev-parse HEAD)" = "6885efec84ac3ffa5cca30669e512f02a8989ee3"
          test "$(cat VERSIE)" = "0.62.1"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Windows-pakket bouwen
        run: |
          for m in api invoer portaal; do (cd "$m" && npm ci --no-audit --no-fund); done
          tools/maak_laptoppakket.sh "$RUNNER_TEMP/batch-gui-laptop" windows
      - name: Pakket controleren en herkomst vastleggen
        run: |
          cd "$RUNNER_TEMP"
          ZIP=batch-gui-laptop-0.62.1-windows.zip
          unzip -tq "$ZIP"
          for f in START.bat runtime/node.exe postgres/bin/postgres.exe db/schema.sql db/migraties/0094; do
            unzip -Z1 "$ZIP" | grep -F "batch-gui-laptop/$f" >/dev/null
          done
          sha256sum "$ZIP" > "$ZIP.sha256"
          printf '%s\n' 'Uitsluitend fictieve gegevens; geen release.' 'Head: 6885efec84ac3ffa5cca30669e512f02a8989ee3' 'Base: 31c86973bf13848cba44fc38785084953fe65e39' 'Acceptatie: 45629975777' > HERKOMST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MES-fase-1-Windows-praktijkpakket-6885efe
          path: |
            ${{ runner.temp }}/batch-gui-laptop-0.62.1-windows.zip
            ${{ runner.temp }}/batch-gui-laptop-0.62.1-windows.zip.sha256
            ${{ runner.temp }}/HERKOMST.txt
          if-no-files-found: error
          retention-days: 7
