name: Documentatiecontrole

on:
  push:
    branches: [main]
    paths: [ROADMAP.md, CHANGELOG.md, docs/DATABASE.md, tools/schema_plaatje.py]
  pull_request:
    branches: [main]
    paths: [ROADMAP.md, CHANGELOG.md, docs/DATABASE.md, tools/schema_plaatje.py]

permissions:
  contents: read

jobs:
  documentatie:
    name: Documentatieconsistentie
    runs-on: ubuntu-latest
    outputs:
      diagram: ${{ steps.wijzigingen.outputs.diagram }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bepaal of alleen documentatie gewijzigd is
        id: wijzigingen
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          if [ "$EVENT" = pull_request ]; then
            begin="$(git merge-base "$BASE" "$HEAD")"
            eind="$HEAD"
          else
            begin="$BEFORE"
            eind="$GITHUB_SHA"
          fi
          git diff --name-only --no-renames -z "$begin" "$eind" > /tmp/docs-wijzigingen
          BEGIN="$begin" END="$eind" python3 - <<'PY'
          import os, pathlib, subprocess
          toegelaten = set(["README.md","CLAUDE.md","DECISIONS.md","ROADMAP.md","CHANGELOG.md","docs/DATABASE.md","docs/PRAKTIJKTESTS.md","docs/SERVER.md","tools/pakket/README.md","docs/mes/ACCEPTANCE-CRITERIA.md","docs/mes/BLUEPRINT.md","docs/mes/DATA-MODEL.md","docs/mes/ISA-CONFORMANCE.md","docs/mes/MBR-EBR-DESIGN.md","docs/mes/MIGRATION-STRATEGY.md","docs/mes/ROLES-AND-PROCESSES.md","docs/mes/TERMINOLOGY.md","docs/mes/VISUAL-STYLE.md"])
          bestanden = set(pathlib.Path("/tmp/docs-wijzigingen").read_bytes().decode().split("\0")) - {""}
          alleen_docs = bool(bestanden) and bestanden <= toegelaten
          roadmap = bool(bestanden & {"ROADMAP.md", "CHANGELOG.md"})
          diagram = bool(bestanden & {"docs/DATABASE.md", "tools/schema_plaatje.py"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"roadmap={str(roadmap).lower()}", file=f)
              print(f"diagram={str(diagram).lower()}", file=f)
          if alleen_docs and "CHANGELOG.md" in bestanden:
              import re
              def versies(ref):
                  inhoud = subprocess.check_output(["git", "show", ref + ":CHANGELOG.md"], text=True)
                  return re.findall(r"^## (\d+\.\d+\.\d+)\b", inhoud, re.M)
              if versies(os.environ["BEGIN"]) != versies(os.environ["END"]):
                  raise SystemExit("Nieuwe, verwijderde of herschikte versies horen in een software-PR.")
          PY
      - name: Roadmap en changelog controleren
        if: steps.wijzigingen.outputs.roadmap == 'true'
        run: |
          tests/test_roadmap.sh
          V="$(cat VERSIE)"
          grep -q "^## $V " CHANGELOG.md
  diagram:
    name: Databasediagram controleren
    needs: documentatie
    if: needs.documentatie.outputs.diagram == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Databasediagram vergelijken met schema
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres }
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          tests/test_schema_plaatje.sh
