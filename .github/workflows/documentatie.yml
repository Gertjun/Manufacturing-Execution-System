name: Documentatiecontrole

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'DECISIONS.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'docs/DATABASE.md'
      - 'db/schema.sql'
      - 'tests/test_schema_plaatje.sh'
      - 'tests/test_roadmap.sh'
      - 'tests/test_diagram_style.py'
      - '.github/workflows/documentatie.yml'
      - '.github/workflows/diagrammen.yml'
      - 'tools/schema_plaatje.py'
      - 'docs/diagrams/**'
      - 'tools/roadmap_diagram.py'
      - 'tests/roadmap-render.mjs'
      - 'tools/render_diagrams.py'
      - 'tests/technical-diagrams-render.mjs'
      - 'docs/mes/**'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'DECISIONS.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'docs/DATABASE.md'
      - 'db/schema.sql'
      - 'tests/test_schema_plaatje.sh'
      - 'tests/test_roadmap.sh'
      - 'tests/test_diagram_style.py'
      - '.github/workflows/documentatie.yml'
      - '.github/workflows/diagrammen.yml'
      - 'tools/schema_plaatje.py'
      - 'docs/diagrams/**'
      - 'tools/roadmap_diagram.py'
      - 'tests/roadmap-render.mjs'
      - 'tools/render_diagrams.py'
      - 'tests/technical-diagrams-render.mjs'
      - 'docs/mes/**'

permissions:
  contents: read

jobs:
  documentatie:
    name: Documentatieconsistentie
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.wijzigingen.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bepaal gewijzigde bronnen en controleer versiebeleid
        id: wijzigingen
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          if [ "$EVENT" = pull_request ]; then
            begin="$(git merge-base "$BASE" "$HEAD")"
            eind="$HEAD"
          else
            begin="$BEFORE"
            eind="$GITHUB_SHA"
          fi
          BEGIN="$begin" END="$eind" python3 - <<'PY'
          import os, re, subprocess
          from tools.render_diagrams import SOURCES

          begin, eind = os.environ["BEGIN"], os.environ["END"]
          toegelaten = {"README.md","CLAUDE.md","DECISIONS.md","ROADMAP.md","CHANGELOG.md","docs/DATABASE.md","docs/PRAKTIJKTESTS.md","docs/SERVER.md","tools/pakket/README.md","docs/mes/ACCEPTANCE-CRITERIA.md","docs/mes/BLUEPRINT.md","docs/mes/DATA-MODEL.md","docs/mes/ISA-CONFORMANCE.md","docs/mes/MBR-EBR-DESIGN.md","docs/mes/MIGRATION-STRATEGY.md","docs/mes/ROLES-AND-PROCESSES.md","docs/mes/TERMINOLOGY.md","docs/mes/VISUAL-STYLE.md"}
          def wijzigingen(vanaf):
              return set(subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", vanaf, eind],
                  text=True,
              ).split("\0")) - {""}

          bestanden = wijzigingen(begin)
          alleen_docs = bool(bestanden) and bestanden <= toegelaten
          vorige = os.environ.get("BEFORE", "")
          bekend = vorige and subprocess.run(
              ["git", "cat-file", "-e", vorige + "^{commit}"], capture_output=True,
          ).returncode == 0
          deze_wijziging = wijzigingen(vorige) if bekend else bestanden
          schema = bool(deze_wijziging & {"db/schema.sql", "tools/schema_plaatje.py", "tests/test_schema_plaatje.sh"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"schema={str(schema).lower()}", file=f)

          diagraminputs = {
              "db/schema.sql", "tools/schema_plaatje.py", "tools/render_diagrams.py",
              "docs/diagrams/roadmap.mmd", "tools/roadmap_diagram.py",
          }
          def mermaid(ref, path):
              inhoud = subprocess.run(
                  ["git", "show", f"{ref}:{path}"], capture_output=True, text=True,
              ).stdout
              return re.findall(r"```mermaid\n(.*?)```", inhoud, re.S)

          if bestanden & diagraminputs or any(
              mermaid(begin, pad) != mermaid(eind, pad)
              for pad in SOURCES.values() if pad in bestanden
          ):
              print("::notice::Diagrambron gewijzigd. Controleer de SVG’s bij technische acceptatie.")
          if alleen_docs and "CHANGELOG.md" in bestanden:
              def versies(ref):
                  inhoud = subprocess.check_output(["git", "show", ref + ":CHANGELOG.md"], text=True)
                  return re.findall(r"^## (\d+\.\d+\.\d+)\b", inhoud, re.M)
              if versies(os.environ["BEGIN"]) != versies(os.environ["END"]):
                  raise SystemExit("Nieuwe, verwijderde of herschikte versies horen in een software-PR.")
          PY
      - name: Roadmap en changelog controleren
        run: |
          tests/test_roadmap.sh
          python3 tests/test_diagram_style.py
          python3 tools/roadmap_diagram.py --check
          V="$(cat VERSIE)"
          grep -q "^## $V " CHANGELOG.md
  schema:
    name: Databasediagram controleren
    needs: documentatie
    if: needs.documentatie.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Databasediagram vergelijken met schema
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres }
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          tests/test_schema_plaatje.sh
