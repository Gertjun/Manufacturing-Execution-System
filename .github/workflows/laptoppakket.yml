name: Laptoppakket

# Bouwt het laptoppakket voor Windows (batch-gui-laptop-<versie>-windows.zip) en hangt het als
# bijlage aan de GitHub Release van die versie. Draait alleen met de hand
# (Actions → Laptoppakket → Run workflow) om ontbrekende pakketten van eerdere versies te maken.
# Elk pakket wordt gebouwd met de code en het bouwscript van zijn eigen tag. De release zelf
# (tag en tekst) verandert niet; er komt alleen een bijlage bij. Alle gegevens zijn fictief.

on:
  workflow_dispatch:
    inputs:
      versies:
        description: "Welke versies (bijv. 0.23.0 of 0.21.1 0.22.0); leeg = alle releases zonder pakket"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: laptoppakket
  cancel-in-progress: false

jobs:
  lijst:
    runs-on: ubuntu-latest
    outputs:
      versies: ${{ steps.lijst.outputs.versies }}
    steps:
      - name: Releases zonder laptoppakket zoeken
        id: lijst
        env:
          GH_TOKEN: ${{ github.token }}
          GEVRAAGD: ${{ inputs.versies }}
        run: |
          # Vanaf 0.7.0 bestaat het Windows-pakket. 0.14.0 en 0.15.0 niet gebruiken (pakkettest faalde).
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | [.tag_name, ([.assets[].name] | map(select(test("^batch-gui-laptop-.*-windows\\.zip$"))) | length)] | @tsv' \
            > /tmp/releases.tsv
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          gevraagd = os.environ.get("GEVRAAGD", "").split()
          overslaan = {"0.14.0", "0.15.0"}
          lijst = []
          for regel in open("/tmp/releases.tsv"):
              tag, pakketten = regel.split()
              v = tag.removeprefix("v")
              deel = tuple(int(x) for x in v.split("."))
              if gevraagd:
                  if v in gevraagd: lijst.append(v)
              elif int(pakketten) == 0 and deel >= (0, 7, 0) and v not in overslaan:
                  lijst.append(v)
          print("versies=" + json.dumps(sorted(lijst, key=lambda v: tuple(map(int, v.split("."))))))
          EOF
          cat "$GITHUB_OUTPUT"

  bouwen:
    needs: lijst
    if: needs.lijst.outputs.versies != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        versie: ${{ fromJSON(needs.lijst.outputs.versies) }}
    steps:
      - name: Code van versie ${{ matrix.versie }} ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ matrix.versie }}
      - name: Node.js instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Afhankelijkheden installeren
        run: |
          for m in api invoer portaal; do (cd $m && npm ci --no-audit --no-fund); done
      - name: Laptoppakket bouwen
        run: |
          tools/maak_laptoppakket.sh "$RUNNER_TEMP/batch-gui-laptop" windows
          ls -la "$RUNNER_TEMP"/batch-gui-laptop-*-windows.zip
      - name: Als bijlage aan de release hangen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ matrix.versie }}" "$RUNNER_TEMP"/batch-gui-laptop-${{ matrix.versie }}-windows.zip \
            --clobber --repo "$GITHUB_REPOSITORY"
