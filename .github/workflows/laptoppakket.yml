name: Laptoppakket

# Bouwt het laptoppakket voor Windows (batch-gui-laptop-<versie>-windows.zip) en hangt het als
# bijlage aan de GitHub Release van die versie. Draait alleen met de hand
# (Actions → Laptoppakket → Run workflow) om ontbrekende pakketten van eerdere versies te maken.
# Elk pakket wordt gebouwd met de code en het bouwscript van zijn eigen tag. De release zelf
# (tag en tekst) verandert niet; er komt alleen een bijlage bij. Alle gegevens zijn fictief.

on:
  workflow_dispatch:
    inputs:
      versies:
        description: "Welke ontbrekende pakketten (bijv. 0.23.0); leeg = alle ondersteunde releases zonder pakket"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lijst:
    runs-on: ubuntu-latest
    outputs:
      versies: ${{ steps.lijst.outputs.versies }}
    steps:
      - name: Selectiebeleid ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Releases zonder laptoppakket zoeken
        id: lijst
        env:
          GH_TOKEN: ${{ github.token }}
          GEVRAAGD: ${{ inputs.versies }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > /tmp/releases.json
          node tools/selecteer_laptoppakketten.mjs /tmp/releases.json >> "$GITHUB_OUTPUT"

  bouwen:
    needs: lijst
    if: needs.lijst.outputs.versies != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        versie: ${{ fromJSON(needs.lijst.outputs.versies) }}
    steps:
      - name: Controleer dat pakket nog ontbreekt
        id: ontbreekt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ matrix.versie }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSIE" > /tmp/release.json
          jq -e '.draft == false and .prerelease == false and (.assets | type == "array")' /tmp/release.json >/dev/null
          aantal="$(jq '[.assets[].name | select(startswith("batch-gui-laptop-") and endswith("-windows.zip"))] | length' /tmp/release.json)"
          if [ "$aantal" = 0 ]; then
            echo "bouwen=true" >> "$GITHUB_OUTPUT"
          else
            echo "bouwen=false" >> "$GITHUB_OUTPUT"
            echo "Pakket bestaat al; geen build of upload."
          fi
      - name: Code van versie ${{ matrix.versie }} ophalen
        if: steps.ontbreekt.outputs.bouwen == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ matrix.versie }}
      - name: Node.js instellen
        if: steps.ontbreekt.outputs.bouwen == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Afhankelijkheden installeren
        if: steps.ontbreekt.outputs.bouwen == 'true'
        run: |
          for m in api invoer portaal; do (cd $m && npm ci --no-audit --no-fund); done
      - name: Laptoppakket bouwen
        if: steps.ontbreekt.outputs.bouwen == 'true'
        run: |
          tools/maak_laptoppakket.sh "$RUNNER_TEMP/batch-gui-laptop" windows
          ls -la "$RUNNER_TEMP"/batch-gui-laptop-*-windows.zip
      - name: Als bijlage aan de release hangen
        if: steps.ontbreekt.outputs.bouwen == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ matrix.versie }}" "$RUNNER_TEMP"/batch-gui-laptop-${{ matrix.versie }}-windows.zip \
            --repo "$GITHUB_REPOSITORY"
