name: Release
# Uitsluitend op uitdrukkelijk verzoek; geen historische backfill.
on:
  workflow_dispatch:
    inputs:
      versie:
        description: "Exacte versie uit VERSIE (bijv. 0.63.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Releasevoorwaarden controleren
        env:
          GH_TOKEN: ${{ github.token }}
          GEVRAAGD: ${{ inputs.versie }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(cat VERSIE)" = "$GEVRAAGD"
          [[ "$GEVRAAGD" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! git show-ref --verify --quiet "refs/tags/v$GEVRAAGD" || { echo "Tag bestaat al"; exit 1; }
          node tools/release.mjs controle "$GEVRAAGD"
          test "$(node tools/verifieer_acceptatie.mjs "$GITHUB_SHA" --require-diagrams)" = true
      - name: Node.js instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Laptoppakket bouwen
        run: |
          for m in api invoer portaal; do (cd "$m" && npm ci --no-audit --no-fund); done
          tools/maak_laptoppakket.sh "$RUNNER_TEMP/batch-gui-laptop" windows
      - name: Geaccepteerde versie publiceren
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSIE: ${{ inputs.versie }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node tools/release.mjs notities "$VERSIE" > /tmp/release-notities.md
          git tag "v$VERSIE" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSIE"
          gh release create "v$VERSIE" --verify-tag --title "Versie $VERSIE" --notes-file /tmp/release-notities.md "$RUNNER_TEMP/batch-gui-laptop-$VERSIE-windows.zip"
