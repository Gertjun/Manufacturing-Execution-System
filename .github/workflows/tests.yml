name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'DECISIONS.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'docs/DATABASE.md'
      - 'docs/PRAKTIJKTESTS.md'
      - 'docs/SERVER.md'
      - 'docs/mes/ACCEPTANCE-CRITERIA.md'
      - 'docs/mes/BLUEPRINT.md'
      - 'docs/mes/DATA-MODEL.md'
      - 'docs/mes/ISA-CONFORMANCE.md'
      - 'docs/mes/MBR-EBR-DESIGN.md'
      - 'docs/mes/MIGRATION-STRATEGY.md'
      - 'docs/mes/ROLES-AND-PROCESSES.md'
      - 'docs/mes/TERMINOLOGY.md'
      - 'docs/mes/VISUAL-STYLE.md'
      - 'tools/pakket/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'DECISIONS.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'docs/DATABASE.md'
      - 'docs/PRAKTIJKTESTS.md'
      - 'docs/SERVER.md'
      - 'docs/mes/ACCEPTANCE-CRITERIA.md'
      - 'docs/mes/BLUEPRINT.md'
      - 'docs/mes/DATA-MODEL.md'
      - 'docs/mes/ISA-CONFORMANCE.md'
      - 'docs/mes/MBR-EBR-DESIGN.md'
      - 'docs/mes/MIGRATION-STRATEGY.md'
      - 'docs/mes/ROLES-AND-PROCESSES.md'
      - 'docs/mes/TERMINOLOGY.md'
      - 'docs/mes/VISUAL-STYLE.md'
      - 'tools/pakket/README.md'
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: read
  actions: read

# Nieuwe wijzigingen op dezelfde branch vervangen oudere, nog lopende test-runs.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || (github.event.action == 'ready_for_review' || github.event.action == 'reopened') && 'pr-status' || 'ontwikkeling' }}
  cancel-in-progress: true

jobs:
  verificatie:
    name: Eerder geteste inhoud verifiëren
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      hergebruik: ${{ steps.bewijs.outputs.hergebruik }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bewijs zoeken
        id: bewijs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resultaat="$(node tools/verifieer_acceptatie.mjs "$GITHUB_SHA")" || resultaat=false
          [ "$resultaat" = true ] || resultaat=false
          echo "hergebruik=$resultaat" >> "$GITHUB_OUTPUT"
  pr-bewijs:
    name: Bestaand PR-testbewijs controleren
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-force-herhaling') && (((github.event.action == 'ready_for_review' || github.event.action == 'reopened') && !github.event.pull_request.draft) || (github.event.action == 'labeled' && (github.event.label.name == 'compatibiliteit-test' || github.event.label.name == 'scherm-test' || github.event.label.name == 'scherm-flow-test' || github.event.label.name == 'scherm-formaten-test' || github.event.label.name == 'scherm-formaten-uitgebreid-test' || github.event.label.name == 'scherm-meldingen-test' || github.event.label.name == 'scherm-beheer-test' || github.event.label.name == 'scherm-productie-test' || github.event.label.name == 'scherm-planning-test' || github.event.label.name == 'scherm-sjabloon-test' || github.event.label.name == 'scherm-engineering-test' || github.event.label.name == 'scherm-overgang-test' || github.event.label.name == 'database-baseline' || github.event.label.name == 'laptop-security')))
    runs-on: ubuntu-latest
    outputs:
      hergebruik: ${{ steps.bewijs.outputs.hergebruik }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: PR-bewijs zoeken
        id: bewijs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MODUS: ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        run: |
          resultaat="$(node tools/verifieer_pr_test.mjs "$HEAD" "$BASE" "$MODUS")" || resultaat=false
          [ "$resultaat" = true ] || resultaat=false
          echo "hergebruik=$resultaat" >> "$GITHUB_OUTPUT"
  ci-policy:
    name: CI-bewijsbeleid testen
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci-policy-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node --test tests/ci-evidence.test.mjs
  compatibility:
    name: Node.js 22-compatibiliteit
    needs: [verificatie, pr-bewijs]
    if: always() && ((github.event_name == 'push' && needs.verificatie.outputs.hergebruik != 'true') || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'compatibiliteit-test' || github.event.label.name == 'acceptatie-test')) || (github.event.action != 'labeled' && !github.event.pull_request.draft)))) && needs.pr-bewijs.outputs.hergebruik != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Geteste tree vastleggen
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -n "$BASE" ]; then git merge-base --is-ancestor "$BASE" HEAD; fi
          git rev-parse 'HEAD^{tree}'
      - name: PR-bewijs ${{ github.event.pull_request.base.sha }} ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE" HEAD
      - name: Node.js 22 instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: CI-bewijsbeleid testen
        run: node --test tests/ci-evidence.test.mjs
      - name: Versienummer overal gelijk
        run: |
          V="$(cat VERSIE)"
          for p in api invoer portaal; do
            [ "$(node -p "require('./$p/package.json').version")" = "$V" ] || { echo "$p/package.json heeft niet versie $V"; exit 1; }
          done
          grep -q "\"$V\"" api/src/versie.ts && grep -q "\"$V\"" gedeeld/versie.ts
          grep -q "^## $V " CHANGELOG.md || { echo "CHANGELOG.md mist versie $V"; exit 1; }
      - name: Roadmap controleren
        run: tests/test_roadmap.sh
      - name: B+ contrastcontract
        run: |
          python3 tests/test_visual_style.py
          python3 tests/test_left_accents.py
      - name: API typecheck op Node.js 22
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Invoerscherm bouwen op Node.js 22
        working-directory: invoer
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node e2e/offline-rechten.mjs
      - name: Portalen bouwen op Node.js 22
        working-directory: portaal
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: B+ componenten in Chrome
        run: node tests/visual-components.mjs
      - name: Portalnavigatie en sessieoverdracht in Chrome
        run: node tests/portal-navigation.mjs

  full-tests:
    name: Volledige testsuite (Node.js 26)
    needs: verificatie
    if: always() && ((github.event_name == 'push' && needs.verificatie.outputs.hergebruik != 'true') || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'acceptatie-test'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: batchgui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Geteste tree vastleggen
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -n "$BASE" ]; then git merge-base --is-ancestor "$BASE" HEAD; fi
          git rev-parse 'HEAD^{tree}'
      - name: Node.js 26 instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: Versienummer overal gelijk
        run: |
          V="$(cat VERSIE)"
          for p in api invoer portaal; do
            [ "$(node -p "require('./$p/package.json').version")" = "$V" ] || { echo "$p/package.json heeft niet versie $V"; exit 1; }
          done
          grep -q "\"$V\"" api/src/versie.ts && grep -q "\"$V\"" gedeeld/versie.ts
          grep -q "^## $V " CHANGELOG.md || { echo "CHANGELOG.md mist versie $V"; exit 1; }
      - name: Roadmap bij met de laatste versie
        run: tests/test_roadmap.sh
      - name: B+ contrastcontract
        run: |
          python3 tests/test_visual_style.py
          python3 tests/test_left_accents.py
      - name: PostgreSQL-client en Python voorbereiden
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          mkdir -p "$RUNNER_TEMP/pg18"
          cat > "$RUNNER_TEMP/pg18/pg_dump" <<'SH'
          #!/bin/bash
          args=()
          output=""
          while (( $# )); do
            if [[ "$1" == "-f" ]]; then output="$2"; shift 2
            else args+=("$1"); shift
            fi
          done
          if [[ -n "$output" ]]; then
            exec docker exec -e PGUSER=postgres "$PG_CONTAINER" pg_dump "${args[@]}" > "$output"
          fi
          exec docker exec -e PGUSER=postgres "$PG_CONTAINER" pg_dump "${args[@]}"
          SH
          cat > "$RUNNER_TEMP/pg18/pg_restore" <<'SH'
          #!/bin/bash
          if [[ "$1" == "--version" ]]; then
            exec docker exec "$PG_CONTAINER" pg_restore --version
          fi
          args=("$@")
          input="${args[-1]}"
          unset 'args[-1]'
          exec docker exec -i -e PGUSER=postgres "$PG_CONTAINER" pg_restore "${args[@]}" < "$input"
          SH
          chmod +x "$RUNNER_TEMP/pg18/pg_dump" "$RUNNER_TEMP/pg18/pg_restore"
          echo "$RUNNER_TEMP/pg18" >> "$GITHUB_PATH"
          echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - name: Databaseregels
        run: |
          python3 tests/test_regels.py "host=localhost port=5432 user=postgres dbname=batchgui"
      - name: Schema en migraties gelijk
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres }
        run: |
          pg_dump --version
          tests/test_migraties.sh
      - name: Plaatje van de database bij (docs/DATABASE.md)
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres }
        run: tests/test_schema_plaatje.sh
      - name: API (als mes_app, met beperkte rechten)
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Security- en beheertoolregressies
        run: node --test tests/security-tools.test.mjs tests/phase2-source-manifest.test.mjs
      - name: Opruimschema back-ups
        run: node --test tests/rotatie.test.mjs
      - name: Beheertools (migreer, back-up, herstel)
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres }
        run: |
          pg_dump --version
          sh tests/test_tools.sh
          sh tests/test_historische_upgrade.sh
      - name: Invoerscherm controleren en bouwen
        working-directory: invoer
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node e2e/offline-rechten.mjs
      - name: Portalen controleren en bouwen
        working-directory: portaal
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: B+ componenten in Chrome
        run: node tests/visual-components.mjs
      - name: Portalnavigatie en sessieoverdracht in Chrome
        run: node tests/portal-navigation.mjs
      - name: Laptoppakket met ingebouwde PostgreSQL (Linux-variant)
        run: tests/test_laptoppakket.sh
      - name: Schermtests in Chrome (invoerscherm, portalen)
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: |
          google-chrome --version
          python3 -m pip install --quiet openpyxl pillow pyzbar
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libzbar0 >/dev/null
          sh tests/test_schermen.sh
      - name: Logboeken van de schermtests tonen
        if: failure()
        run: |
          for log in /tmp/schermtest-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo '::endgroup::'
          done

  screen-regression:
    name: Gerichte Chrome-schermregressies (Node.js 26)
    needs: pr-bewijs
    if: always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'scherm-test' || github.event.label.name == 'scherm-review-test')) && needs.pr-bewijs.outputs.hergebruik != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: batchgui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Geteste tree vastleggen
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -n "$BASE" ]; then git merge-base --is-ancestor "$BASE" HEAD; fi
          git rev-parse 'HEAD^{tree}'
      - name: PR-bewijs ${{ github.event.pull_request.base.sha }} ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE" HEAD
      - name: Node.js 26 instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: Afhankelijkheden en builds voorbereiden
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          for m in api invoer portaal; do (cd "$m" && npm ci --no-audit --no-fund); done
          npm run build --prefix invoer
          npm run build --prefix portaal
      - name: Schermtests in Chrome (invoerscherm, portalen)
        env:
          MES_SCREEN_FORMATS: ${{ github.event.label.name == 'scherm-review-test' && 'uitgebreid' || 'basis' }}
          MES_SCREENSHOTS: ${{ github.event.label.name == 'scherm-review-test' && 'review' || 'failure' }}
          DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: |
          google-chrome --version
          python3 -m pip install --quiet openpyxl pillow pyzbar
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libzbar0 >/dev/null
          sh tests/test_schermen.sh
      - name: Logboeken van de schermtests tonen
        if: failure()
        run: |
          for log in /tmp/schermtest-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo '::endgroup::'
          done

  individual-screen:
    name: Individuele Chrome-regressie (${{ github.event.label.name }})
    needs: pr-bewijs
    if: always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'scherm-flow-test' || github.event.label.name == 'scherm-formaten-test' || github.event.label.name == 'scherm-formaten-uitgebreid-test' || github.event.label.name == 'scherm-meldingen-test' || github.event.label.name == 'scherm-beheer-test' || github.event.label.name == 'scherm-productie-test' || github.event.label.name == 'scherm-planning-test' || github.event.label.name == 'scherm-sjabloon-test' || github.event.label.name == 'scherm-engineering-test' || github.event.label.name == 'scherm-overgang-test')) && needs.pr-bewijs.outputs.hergebruik != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: batchgui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Geteste tree vastleggen
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          if [ -n "$BASE" ]; then git merge-base --is-ancestor "$BASE" HEAD; fi
          git rev-parse 'HEAD^{tree}'
      - name: PR-bewijs ${{ github.event.pull_request.base.sha }} ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE" HEAD
      - name: Node.js 26 instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: Schermtestselectie controleren
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          case "$LABEL" in
            scherm-flow-test|scherm-formaten-test|scherm-formaten-uitgebreid-test|scherm-meldingen-test|scherm-beheer-test|scherm-productie-test|scherm-planning-test|scherm-sjabloon-test|scherm-engineering-test|scherm-overgang-test) ;;
            *) exit 2 ;;
          esac
          selectie="${LABEL#scherm-}"
          echo "SCHERM_SELECTIE=${selectie%-test}" >> "$GITHUB_ENV"
          sh -n tests/test_schermen.sh
          for script in invoer/e2e/*.mjs portaal/e2e/*.mjs tests/screen-formats.mjs tests/screen-api-lifecycle.mjs; do node --check "$script"; done
      - name: Afhankelijkheden en builds voorbereiden
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          for m in api invoer portaal; do (cd "$m" && npm ci --no-audit --no-fund); done
          npm run build --prefix invoer
          npm run build --prefix portaal
      - name: Schermtests in Chrome (invoerscherm, portalen)
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: |
          google-chrome --version
          python3 -m pip install --quiet openpyxl pillow pyzbar
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libzbar0 >/dev/null
          sh tests/test_schermen.sh "$SCHERM_SELECTIE"
      - name: Logboeken van de schermtests tonen
        if: failure()
        run: |
          for log in /tmp/schermtest-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo '::endgroup::'
          done

  database-baseline:
    name: Gerichte PostgreSQL-baseline (D100)
    needs: pr-bewijs
    if: always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'database-baseline') && needs.pr-bewijs.outputs.hergebruik != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: batchgui
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Head en base controleren
        id: basis
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" HEAD
          git rev-parse 'HEAD^{tree}'
      - name: PR-bewijs ${{ github.event.pull_request.base.sha }} ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE" HEAD
      - name: PostgreSQL-client en Python voorbereiden
        id: tools
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          mkdir -p "$RUNNER_TEMP/pg18"
          cat > "$RUNNER_TEMP/pg18/pg_dump" <<'SH'
          #!/bin/bash
          args=()
          output=""
          while (( $# )); do
            if [[ "$1" == "-f" ]]; then output="$2"; shift 2
            else args+=("$1"); shift
            fi
          done
          if [[ -n "$output" ]]; then
            exec docker exec -e PGUSER=postgres "$PG_CONTAINER" pg_dump "${args[@]}" > "$output"
          fi
          exec docker exec -e PGUSER=postgres "$PG_CONTAINER" pg_dump "${args[@]}"
          SH
          cat > "$RUNNER_TEMP/pg18/pg_restore" <<'SH'
          #!/bin/bash
          if [[ "$1" == "--version" ]]; then
            exec docker exec "$PG_CONTAINER" pg_restore --version
          fi
          args=("$@")
          input="${args[-1]}"
          unset 'args[-1]'
          exec docker exec -i -e PGUSER=postgres "$PG_CONTAINER" pg_restore "${args[@]}" < "$input"
          SH
          chmod +x "$RUNNER_TEMP/pg18/pg_dump" "$RUNNER_TEMP/pg18/pg_restore"
          echo "$RUNNER_TEMP/pg18" >> "$GITHUB_PATH"
          echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - name: Roadmap controleren
        if: always() && steps.basis.outcome == 'success'
        run: tests/test_roadmap.sh
      - name: Schone installatie met foutregels
        id: schema
        if: always() && steps.tools.outcome == 'success'
        run: |
          psql -v ON_ERROR_STOP=1 -d batchgui -f db/schema.sql > /tmp/mes-schema.log 2>&1 || { tail -60 /tmp/mes-schema.log; exit 1; }
      - name: Schema en migraties vergelijken
        if: always() && steps.tools.outcome == 'success'
        run: tests/test_migraties.sh
      - name: Databaseregels en beperkte rechten
        if: always() && steps.schema.outcome == 'success'
        run: python3 tests/test_regels.py "host=localhost port=5432 user=postgres dbname=batchgui"
      - name: Node.js 22 instellen
        id: node
        if: always() && steps.basis.outcome == 'success'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: Security- en beheertoolregressies
        if: always() && steps.node.outcome == 'success'
        run: node --test tests/security-tools.test.mjs tests/phase2-source-manifest.test.mjs
      - name: API afhankelijkheden
        id: npm
        if: always() && steps.node.outcome == 'success'
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Beheertools — migratie, back-up en herstel
        if: always() && steps.npm.outcome == 'success' && steps.tools.outcome == 'success'
        run: |
          pg_dump --version
          pg_restore --version
          sh tests/test_tools.sh
          sh tests/test_historische_upgrade.sh
      - name: API typecheck en autorisatiemodule
        if: always() && steps.npm.outcome == 'success'
        working-directory: api
        run: |
          npm run typecheck
          npx --no-install tsx --test test/authorization.test.ts
      - name: API-regressies met beperkte rechten
        if: always() && steps.npm.outcome == 'success' && steps.schema.outcome == 'success'
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/batchgui
          TEST_APP_DATABASE_URL: postgres://mes_app@localhost:5432/batchgui
        run: npm test

      - name: Genereer databaseplaatje en OpenAPI voor ontwikkelreview
        if: always() && steps.schema.outcome == 'success' && steps.npm.outcome == 'success'
        run: |
          python3 tools/schema_plaatje.py "host=localhost port=5432 user=postgres" /tmp/MES-DATABASE.md
          (cd api && npm run openapi)
          echo 'BEGIN_GENERATED_DATABASE'
          cat /tmp/MES-DATABASE.md
          echo 'END_GENERATED_DATABASE'
          echo 'BEGIN_GENERATED_OPENAPI'
          node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync("api/openapi.json","utf8")))+"\\n")'
          echo 'END_GENERATED_OPENAPI'
      - name: Laptoppakket — SCRAM, upgrade en herstel (Linux)
        if: always() && steps.npm.outcome == 'success'
        run: |
          npm ci --prefix invoer --no-audit --no-fund
          npm ci --prefix portaal --no-audit --no-fund
          tests/test_laptoppakket.sh

  laptop-security:
    name: Gerichte laptoppakketbeveiliging (D24/D100)
    needs: pr-bewijs
    if: always() && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'laptop-security') && needs.pr-bewijs.outputs.hergebruik != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Head en base controleren
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          git merge-base --is-ancestor "$BASE" HEAD
          git rev-parse 'HEAD^{tree}'
      - name: PR-bewijs ${{ github.event.pull_request.base.sha }} ${{ github.event.action == 'labeled' && github.event.label.name || 'compatibiliteit-test' }}
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE" HEAD
      - name: Node.js 22 instellen
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            invoer/package-lock.json
            portaal/package-lock.json
      - name: Pakketafhankelijkheden
        run: |
          npm ci --prefix api --no-audit --no-fund
          npm ci --prefix invoer --no-audit --no-fund
          npm ci --prefix portaal --no-audit --no-fund
      - name: Laptoppakket — SCRAM, upgrade en herstel (Linux)
        run: tests/test_laptoppakket.sh
